server.port=8000

# DataSource — env vars injected by Helm/Docker Compose; defaults for local dev
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smartfreight}
spring.datasource.username=${POSTGRES_USER:smartfreight}
spring.datasource.password=${POSTGRES_PASSWORD:smartfreight}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Column and table names are snake_case (avg_transit_days). Spring Boot 3 supplied that by default; Boot 4
# does not (its own CamelCaseToUnderscoresNamingStrategy is gone and Hibernate maps names as written), so
# the strategy is set here. It only applies to names Hibernate does not quote: with
# hibernate.globally_quoted_identifiers=true (which this file used to set, to protect "timestamp") Hibernate 7
# keeps the camelCase names and adds "avgTransitDays" columns beside the existing avg_transit_days ones.
# Unquoted, "timestamp" is a valid PostgreSQL column name (a non-reserved keyword).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl

# Jackson — snake_case JSON matching the Python API contract. ISO-8601 datetime strings are Jackson 3's
# default (Spring Boot 4), so the old write-dates-as-timestamps=false is gone: it no longer maps and fails startup.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Shipment lifecycle scheduler
smartfreight.lifecycle.enabled=true
smartfreight.lifecycle.tick-ms=600000
smartfreight.lifecycle.pool-min=30
smartfreight.lifecycle.purge-days=30
